[workspace]
members = [".", "expr"]
resolver = "2"

[package]
name = "hypervox"
version = "0.1.0"
edition = "2024"
description = "Voxel graphical calculator for N-dimensional mathematical expressions"
authors = ["timasoft <tima.klester@yandex.ru>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/timasoft/hypervox"
homepage = "https://github.com/timasoft/hypervox"
keywords = ["voxel", "math", "calculator", "3d", "bevy"]
categories = ["graphics", "visualization", "mathematics"]

[features]
fma = ["hypervox_expr/fma"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
debug = false
overflow-checks = false

[profile.release.package.hypervox_expr]
opt-level = 3
codegen-units = 1

[dependencies]
hypervox_expr = { path = "expr" }
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_ui_render",
    "default_font",
    "bevy_log",
] }
# 0.42 requires egui 0.36 whose DroppedFileHandle is !Send on wasm32 with +atomics
bevy_egui = "=0.41.1"
bevy_panorbit_camera = "0.35.0"
rand = "0.10.1"
rayon = "1.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_ui_render",
    "default_font",
    "bevy_log",
    "x11",
    "wayland",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_ui_render",
    "default_font",
    "bevy_log",
    "bevy_winit",
    "webgl2",
] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"
web-sys = "=0.3.103"
wasm-bindgen-futures = "=0.4.76"
web-time = "1.1.0"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }

[lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

cast_precision_loss = "allow"
multiple_crate_versions = "allow"

allow_attributes = "warn"
arithmetic_side_effects = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
default_numeric_fallback = "warn"
exit = "warn"
field_scoped_visibility_modifiers = "warn"
fn_to_numeric_cast_any = "warn"
indexing_slicing = "warn"
iter_over_hash_type = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
map_with_unused_argument_over_ranges = "warn"
min_ident_chars = "warn"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
panic = "warn"
partial_pub_fields = "warn"
precedence_bits = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
shadow_reuse = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
use_debug = "warn"
